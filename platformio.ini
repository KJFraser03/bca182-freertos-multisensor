[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200
build_flags = 
    -I include
    -I lib/FreeRTOS/include
    -I lib/FreeRTOS/portable/GCC/ARM_CM3
    -DSTM32F103xB
test_ignore = test_logic

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = 
    -I include
    -DUNIT_TEST